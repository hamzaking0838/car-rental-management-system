<section id="contact" class="contact-section">
  <div class="container">
    <div class="text-center contact-header fade-up">
      <h2>Contact <span>Us</span></h2>
      <p>We’d love to hear from you — get in touch anytime!</p>
    </div>

    <div class="row align-items-center g-4 fade-up">
      <!-- Left Info -->
      <div class="col-12 col-md-6">
        <div class="contact-info">
          <h4>Get in Touch</h4>
          <p><i class="bi bi-geo-alt-fill"></i> AutoRent HQ, Lahore, Pakistan</p>
          <p><i class="bi bi-envelope-fill"></i> support@autorent.com</p>
          <p><i class="bi bi-telephone-fill"></i> +92 300 1234567</p>

         <div class="social-links">
            <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              <i class="bi bi-facebook"></i>
            </a>

            <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <i class="bi bi-instagram"></i>
            </a>

            <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
              <i class="bi bi-twitter-x"></i>
            </a>

            <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
              <i class="bi bi-linkedin"></i>
            </a>
</div>
        </div>
      </div>

      <!-- Right Form -->
      <div class="col-12 col-md-6">
        <form class="contact-form">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea rows="4" placeholder="Your Message" required></textarea>
          <button type="submit" class="contact-btn">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</section>
