<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />

  <!-- Theme variables and toggle styles -->
  <link rel="stylesheet" href="/css/theme-toggle.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-label="Reset password">
      <aside class="auth-brand-panel">
        <div class="auth-brand-mark">CR</div>
        <div class="auth-brand-content">
          <div class="auth-mini-label">Password Reset</div>
          <h1 class="auth-brand-title">Forgot Password</h1>
          <p class="auth-brand-text">Enter your email to receive a verification code.</p>
        </div>
      </aside>

      <div class="auth-form-panel">
        <div class="auth-form-panel-inner">
          <div class="auth-form-head">
            <a href="/user/login.html" class="auth-top-link">Back to Login</a>
            <h2 class="auth-form-title">Reset Password</h2>
            <p class="auth-form-subtitle">Provide your email to get a verification code and then set a new password.</p>
          </div>

          <div id="userResetAlert" class="alert alert-danger auth-alert d-none" role="alert"></div>
          <div id="userResetSuccess" class="alert alert-success auth-alert d-none" role="alert"></div>

          <form id="userResetForm">
            <!-- Email input and send code button -->
            <div class="auth-field">
              <label for="resetEmail">Email address</label>
              <input type="email" class="form-control" id="resetEmail" placeholder="Enter your email" autocomplete="email" required />
            </div>
            <div class="d-flex justify-content-end mb-3">
              <button type="button" id="sendCodeBtn" class="btn auth-submit-btn">Send Code</button>
            </div>
            <!-- Verification code input (hidden by default via JS) -->
            <div class="auth-field" id="codeGroup">
              <label for="resetCode">Verification Code</label>
              <input type="text" class="form-control" id="resetCode" placeholder="Enter verification code" autocomplete="one-time-code" />
            </div>
            <!-- New password input (hidden by default via JS) -->
            <div class="auth-field" id="passwordGroup">
              <label for="resetPassword">New Password</label>
              <input type="password" class="form-control" id="resetPassword" placeholder="Enter new password" autocomplete="new-password" />
            </div>
            <!-- Reset button (hidden by default via JS) -->
            <button type="submit" id="resetBtn" class="btn auth-submit-btn">Reset Password</button>
          </form>

        </div>
      </div>
    </section>
  </main>
  <script src="/js/user_forgot_password.js"></script>

  <!-- Theme toggling script -->
  <script src="/js/theme-toggle.js"></script>
</body>
</html>
