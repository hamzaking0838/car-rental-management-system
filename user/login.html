<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />

  <!-- Theme variables and toggle styles -->
  <link rel="stylesheet" href="/css/theme-toggle.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-label="User login">
      <aside class="auth-brand-panel">
        <div class="auth-brand-mark">CL</div>
        <div class="auth-brand-content">
          <div class="auth-mini-label">Customer Login</div>
          <h1 class="auth-brand-title">Welcome Back</h1>
          <p class="auth-brand-text">Login to manage your car bookings.</p>
        </div>
      </aside>

      <div class="auth-form-panel">
        <div class="auth-form-panel-inner">
          <div class="auth-form-head">
            <a href="/index.html" class="auth-top-link">Back to Home</a>
            <h2 class="auth-form-title">Login</h2>
            <p class="auth-form-subtitle">Enter your account details below.</p>
          </div>

          <div id="userLoginAlert" class="alert alert-danger auth-alert d-none" role="alert"></div>

          <form id="userLoginForm">
            <div class="auth-field">
              <label for="userEmail">Email address</label>
              <input type="email" class="form-control" id="userEmail" placeholder="Enter your email" autocomplete="username" required />
            </div>
            <div class="auth-field">
              <label for="userPassword">Password</label>
              <input type="password" class="form-control" id="userPassword" placeholder="Enter your password" autocomplete="current-password" required />
            </div>
            <!-- Added a forgot password link below the password input so users can reset their credentials -->
            <div class="d-flex justify-content-end mb-2">
              <a href="/user/forgot_password.html" class="auth-forgot-link">Forgot password?</a>
            </div>
            <button type="submit" class="btn auth-submit-btn">Login</button>
          </form>

          <p class="auth-switch-text">Don't have an account? <a href="/user/register.html">Create account</a></p>
        </div>
      </div>
    </section>
  </main>
  <script src="/js/user_login.js"></script>

  <!-- Theme toggling script -->
  <script src="/js/theme-toggle.js"></script>
</body>
</html>
