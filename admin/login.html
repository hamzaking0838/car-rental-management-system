<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/auth.css" />

  <!-- Theme variables and toggle styles -->
  <link rel="stylesheet" href="/css/theme-toggle.css" />
</head>
<body class="auth-page admin-auth-page">
  <main class="auth-shell">
    <section class="auth-card auth-card-admin" aria-label="Admin login">
      <aside class="auth-brand-panel admin-brand-panel">
        <div class="auth-brand-mark">AD</div>
        <div class="auth-brand-content">
          <div class="auth-mini-label">Admin Access</div>
          <h1 class="auth-brand-title">Admin Panel</h1>
          <p class="auth-brand-text">Manage bookings, cars and availability.</p>
        </div>
      </aside>

      <div class="auth-form-panel">
        <div class="auth-form-panel-inner auth-admin-form-inner">
          <div class="auth-form-head">
            <a href="/index.html" class="auth-top-link">Back to Home</a>
            <h2 class="auth-form-title">Admin Login</h2>
            <p class="auth-form-subtitle">Enter your admin credentials.</p>
          </div>

          <div id="loginAlert" class="alert alert-danger auth-alert d-none" role="alert"></div>

          <form id="adminLoginForm">
            <div class="auth-field">
              <label for="adminEmail">Email address</label>
              <input type="email" class="form-control" id="adminEmail" placeholder="Enter admin email" autocomplete="username" required />
            </div>
            <div class="auth-field">
              <label for="adminPassword">Password</label>
              <input type="password" class="form-control" id="adminPassword" placeholder="Enter password" autocomplete="current-password" required />
            </div>
            <button type="submit" class="btn auth-submit-btn">Login</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/admin_login.js"></script>

  <!-- Theme toggling script -->
  <script src="/js/theme-toggle.js"></script>
</body>
</html>
